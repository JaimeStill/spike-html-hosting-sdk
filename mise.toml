# Adapted from spike-html-apps-foundation (d5037b4): mise.toml, renamed, lint only.
# Adapted from spike-html-hosting-components (0f64672): mise.toml, with a pack check.
# Adapted from spike-html-apps-tooling (c598810): mise.toml, its typescript-go, ESLint, type check,
# build, and unit tier.
# Adapted from spike-html-hosting-architecture (a20a1e0): mise.toml, its chrome-headless-shell and
# browser tier, over the fixture site.
# Tasks never install a missing tool; mise run install is the one task that reads the network.
[settings]
task.run_auto_install = false

# The SDK's toolchain.
[tools]
actionlint = "1.7.12"
node = "26.13.0"
pnpm = "12.16.1"
shellcheck = "0.11.0"
"github:microsoft/typescript-go" = { version = "7.0.2", version_prefix = "typescript/v", bin_path = "package/lib" }

# The browser tier's browser. Chrome for Testing publishes no checksums: take the sha256 and size
# from the download by hand at each bump; currency reads the version_list_url through mise outdated.
[tools."http:chrome-headless-shell"]
version = "157.0.8103.38"
version_list_url = "https://googlechromelabs.github.io/chrome-for-testing/last-known-good-versions.json"
version_json_path = ".channels.Stable.version"

[tools."http:chrome-headless-shell".platforms]
linux-x64 = { url = "https://storage.googleapis.com/chrome-for-testing-public/{{ version }}/linux64/chrome-headless-shell-linux64.zip", checksum = "sha256:deafffa74660b34853a4119c361fd427ac8c9fcb62db51ddb8a797cd83a4ba2d", size = "128168542" }

[tasks.preflight]
description = "Fail naming mise run install when a tool the tasks need is missing, and with the browser argument the pinned chrome-headless-shell"
hide = true
run = "scripts/preflight.sh"

[tasks.lint]
description = "Run the linters: ESLint, Prettier, shellcheck, and actionlint"
depends = ["lint:eslint", "lint:format", "lint:shell", "lint:workflows"]

# The SDK's own lint is its export, src/eslint.ts's config, which eslint.config.js imports from the
# source, so it needs no build.
[tasks."lint:eslint"]
description = "Lint with ESLint: the SDK's exported config over the sources, the tests, and dist/"
depends = ["preflight"]
run = "pnpm exec eslint ."

[tasks."lint:format"]
description = "Check the format with Prettier"
depends = ["preflight"]
run = "pnpm exec prettier --check ."

[tasks."lint:shell"]
description = "Shellcheck the scripts and the currency bin; the template's are the scaffold test's"
run = "shellcheck scripts/*.sh bin/*.sh"

# actionlint shellchecks each run: block too, with the shellcheck pinned above.
[tasks."lint:workflows"]
description = "Lint the GitHub Actions workflows with actionlint"
run = "actionlint"

[tasks.types]
description = "Type-check the sources and the suite with typescript-go's tsc"
depends = ["types:src", "types:test"]

[tasks."types:src"]
description = "Type-check the sources with tsc"
depends = ["preflight"]
run = "tsc --noEmit -p ."

# The unit tier imports src/, and the pack check names the package only in the scratch site's
# files, so neither needs the build.
[tasks."types:test"]
description = "Type-check the suite and the lint config with tsc, under tsconfig.test.json"
depends = ["preflight"]
run = "tsc -p tsconfig.test.json"

[tasks.build]
description = "Build src/ into dist/: tsc's emit, and the stylesheet, tsconfig base, and Prettier configuration copied beside it"
depends = ["preflight"]
run = "scripts/build.sh"

[tasks."test:unit"]
description = "Run the unit tier on src/, the leftover check's ESLint runs and the content check's scratch sites in TMPDIR"
depends = ["preflight"]
run = "node --test 'test/unit/*.test.ts'"

[tasks."test:pack"]
description = "Pack the build, install the tarball into a scratch site in TMPDIR, resolve each export from it, and run the currency bin pnpm links"
depends = ["preflight", "build"]
run = "node --test 'test/pack/*.test.ts'"

# The fixture site the browser tier checks, built by the SDK's own plugins from its source, so it
# needs no build of the SDK.
[tasks."build:fixture"]
description = "Build the fixture site, test/fixtures/site/, with Vite into its dist/, under its base"
depends = ["preflight"]
run = "../../../node_modules/.bin/vite build --logLevel warn"
dir = "{{config_root}}/test/fixtures/site"

[tasks."test:browser"]
description = "Run the browser tier on the fixture site's build, served under its base, in the pinned chrome-headless-shell: the shell checks, the crawl, and the screenshots command, its captures under a scratch TMPDIR"
depends = ["preflight browser", "build:fixture"]
run = "BROWSER_EXECUTABLE=$(mise which chrome-headless-shell) node --test 'test/browser/*.test.ts'"

[tasks."test:scaffold"]
description = "Run the scaffold bin into a scratch dir in TMPDIR, its lockfile step a stub, check the site it makes, install that site offline with every package linked from the working tree and its install, and run the site's own mise run check"
depends = ["preflight browser", "build"]
run = "node --test 'test/scaffold/*.test.ts'"

# The check's steps one after another, each a task: the lint, the type check, the build, the unit
# tier, the pack check, which packs the build before it, the browser tier, which builds the
# fixture site before it, and the scaffold test, which runs a scaffolded site's own check on the
# build.
[tasks.check]
description = "Run every check, in order; reads no network; writes dist/ and the fixture site's dist/"
run = [
  { task = "lint" },
  { task = "types" },
  { task = "build" },
  { task = "test:unit" },
  { task = "test:pack" },
  { task = "test:browser" },
  { task = "test:scaffold" },
]

[tasks.install]
description = "Install the pins and node_modules; reads the network"
run = ["mise install", "pnpm install --frozen-lockfile"]

# The SDK's own currency bin, which a site runs from the package, here from its source.
[tasks.currency]
description = "Report every mise tool, package.json pin (a registry version or a github: tag), and workflow action or reusable workflow pin behind its latest, one line each, exiting nonzero if any; reads the network, writes nothing"
run = "bin/currency.sh"
# Without mise's own command echo, so a current tree prints nothing at all.
quiet = true

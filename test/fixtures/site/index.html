<!doctype html>
<!-- The fixture site's shell, which every page of its build fills (markdown-pages.ts), its title
     the page's name and its main element the page's body: a site's index.html, as the sites write
     it. The foundation's full page entry and its registrations, every built-in profile, so the
     settings offer each, its preferences module, and its keys module, render-blocking; the
     components' glyph-button.css and the SDK's site.css, each by its package's name, after the
     entry. The components' seven elements, render-blocking too: the site nav, at the header's
     start, and the site index, the page header, the section tree, and the Pages drawer that holds
     the site index, which markdownPages writes into each page, and the shortcuts list and the
     settings; and, as the template's shell, the three buttons of the header's header-actions
     group: Pages, which opens the drawer below its dock, with the page's script that wires it,
     and Help and Settings, the openers of the shortcut dialogs, dialog#help holding sl-shortcuts
     and dialog#settings holding sl-settings, each named by its heading and closed by its Close.
     Each header button, and each dialog's Close, is a glyph button showing a glyph marker, which
     the build fills from the icons layer, and its key hint, Esc for a Close, named by its
     aria-label with no word shown, and that name in its interest hint.
     Adapted from spike-html-hosting-architecture (1f3bf14): index.html, its title and text the
     fixture's, and the site stylesheet the SDK's.
     Adapted from spike-html-hosting-components (v0.2.2): README.md, sl-drawer's Pages opener, its
     button and its script.
     Adapted from spike-html-hosting-components (v0.4.0): README.md, the header buttons' and the
     dialog Close's glyph markers.
     Adapted from spike-html-hosting-components (e3e60a8): README.md, sl-drawer's header, its
     header-actions group, the Settings opener, each glyph button's class and interest hint, and
     the shortcut dialogs, Help's and Settings'.
     Adapted from spike-html-apps-foundation (18e0c55): demo/keys.html, its Help button. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>The fixture site</title>
    <link rel="stylesheet" href="@jaimestill/spike-html-apps-foundation/page-full.css" />
    <link rel="stylesheet" href="@jaimestill/spike-html-hosting-components/glyph-button.css" />
    <link rel="stylesheet" href="@jaimestill/spike-html-hosting-sdk/site.css" />
    <script type="module" blocking="render" src="@jaimestill/spike-html-apps-foundation/register-full.js"></script>
    <script type="module" blocking="render" src="@jaimestill/spike-html-apps-foundation/preferences.js"></script>
    <script type="module" blocking="render" src="@jaimestill/spike-html-apps-foundation/keys.js"></script>
    <script type="module" blocking="render" src="@jaimestill/spike-html-hosting-components/site-nav.js"></script>
    <script type="module" blocking="render" src="@jaimestill/spike-html-hosting-components/site-index.js"></script>
    <script type="module" blocking="render" src="@jaimestill/spike-html-hosting-components/page-header.js"></script>
    <script type="module" blocking="render" src="@jaimestill/spike-html-hosting-components/section-tree.js"></script>
    <script type="module" blocking="render" src="@jaimestill/spike-html-hosting-components/drawer.js"></script>
    <script type="module" blocking="render" src="@jaimestill/spike-html-hosting-components/shortcuts.js"></script>
    <script type="module" blocking="render" src="@jaimestill/spike-html-hosting-components/settings.js"></script>
    <script type="module" blocking="render">
      // The Pages button opens the Pages drawer, which holds the site index, and says through
      // aria-expanded whether it is open.
      const drawer = document.querySelector("sl-drawer#pages");
      const opener = document.querySelector(".pages-opener");
      opener.addEventListener("click", () => drawer.show());
      const expanded = () => opener.setAttribute("aria-expanded", String(drawer.open));
      drawer.addEventListener("open", expanded);
      drawer.addEventListener("close", expanded);
    </script>
  </head>
  <body>
    <header>
      <sl-site-nav></sl-site-nav>
      <div class="header-actions">
        <button
          type="button"
          class="glyph-button pages-opener"
          aria-controls="pages"
          aria-haspopup="dialog"
          aria-expanded="false"
          aria-label="Pages"
          data-keys="p"
          interestfor="pages-hint"
          aria-description=""
        >
          <svg data-icon="octicon/list-unordered-16"></svg>
          <span aria-hidden="true"><kbd>P</kbd></span>
        </button>
        <div id="pages-hint" class="glyph-hint" popover="hint" aria-hidden="true">Pages</div>
        <button
          type="button"
          class="glyph-button"
          commandfor="help"
          command="show-modal"
          aria-label="Help"
          data-keys="?"
          interestfor="help-hint"
          aria-description=""
        >
          <svg data-icon="octicon/question-16"></svg>
          <span aria-hidden="true"><kbd>?</kbd></span>
        </button>
        <div id="help-hint" class="glyph-hint" popover="hint" aria-hidden="true">Help</div>
        <button
          type="button"
          class="glyph-button"
          commandfor="settings"
          command="show-modal"
          aria-label="Settings"
          data-keys="s"
          interestfor="settings-hint"
          aria-description=""
        >
          <svg data-icon="octicon/gear-16"></svg>
          <span aria-hidden="true"><kbd>S</kbd></span>
        </button>
        <div id="settings-hint" class="glyph-hint" popover="hint" aria-hidden="true">Settings</div>
      </div>
    </header>
    <main></main>
    <dialog id="help" aria-labelledby="help-title">
      <h2 id="help-title">Keyboard shortcuts</h2>
      <sl-shortcuts></sl-shortcuts>
      <footer>
        <button
          type="button"
          class="glyph-button"
          commandfor="help"
          command="close"
          aria-label="Close"
          interestfor="help-close-hint"
          aria-description=""
        >
          <svg data-icon="octicon/x-16"></svg>
          <span aria-hidden="true"><kbd>Esc</kbd></span>
        </button>
        <div id="help-close-hint" class="glyph-hint" popover="hint" aria-hidden="true">Close</div>
      </footer>
    </dialog>
    <dialog id="settings" aria-labelledby="settings-title">
      <h2 id="settings-title">Settings</h2>
      <sl-settings></sl-settings>
      <footer>
        <button
          type="button"
          class="glyph-button"
          commandfor="settings"
          command="close"
          aria-label="Close"
          interestfor="settings-close-hint"
          aria-description=""
        >
          <svg data-icon="octicon/x-16"></svg>
          <span aria-hidden="true"><kbd>Esc</kbd></span>
        </button>
        <div id="settings-close-hint" class="glyph-hint" popover="hint" aria-hidden="true">Close</div>
      </footer>
    </dialog>
  </body>
</html>

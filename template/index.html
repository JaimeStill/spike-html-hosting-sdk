<!doctype html>
<!-- The site's GitHub Pages shell, which every page of the build fills (the SDK's markdownPages),
     its title the page's name and its main element the page's body. The foundation's full page
     entry and its registrations, every built-in profile, so the theme menu offers each, its
     preferences module, and its keys module, render-blocking, as the build makes every module
     script one entry; then the components' glyph-button.css and the SDK's site.css, each by its
     package's name, in that order after the entry. The components' five elements, each module
     defining its element, render-blocking too: the site nav, at the header's start, and the site
     index, the page header, the section tree, and the drawer that holds the site index, which the
     SDK's markdownPages writes into each page with their light-DOM content. The header is the site
     nav and one group of buttons at its inline end, header-actions: Pages, Help, and Settings, in
     that order, which site.css keeps on the header's first line at every width. The Pages button
     opens that drawer, labeled Pages, keys.js clicking it on P; site.css shows it only below the
     drawer's dock, once the drawer is defined, and the page's script wires its click to the
     drawer's show() and keeps its aria-expanded in step with the drawer's open and close events,
     as spike-html-hosting-components' README gives the opener. The Help button opens the keys
     help dialog by the invoker command show-modal, keys.js clicking it on ?; keys.js fills the
     dialog's [data-keys-list] as it opens with every binding the page has, the section tree's H
     and L among them, and the reader's switch that turns the character keys off (WCAG 2.1.4). The
     Settings button, which keys.js clicks on S, sends show-modal to dialog#settings, which the
     page's script cancels to open the theme menu in its place until that dialog holds the
     reader's settings. Each header button, and the dialog's Close, is a glyph button: it shows a
     glyph and its key hint, a kbd alone and aria-hidden, and no word, is named by its aria-label,
     which the dialog lists, and shows that name in its interest hint, a glyph-hint popover. Each
     glyph is a marker, <svg data-icon="octicon/<name>">, which the SDK's markdownPages fills at
     build with the icons layer's svg: list-unordered-16 for Pages, question-16 for Help, gear-16
     for Settings, and x-16 for Close.
     Adapted from spike-html-hosting (cb0511c): index.html, its title and text this site's, and its
     page a shell.
     Adapted from spike-html-hosting (fba414c): index.html, its full page entry, its keys module,
     and the Theme button that keys.js clicks on T.
     Adapted from spike-html-hosting-architecture (27d70e1): index.html, its title the site's
     repository and its stylesheet the SDK's.
     Adapted from spike-html-hosting-components (v0.4.0): README.md, sl-drawer's Pages opener, its
     button and its script, and each header button's and the dialog Close's glyph marker.
     Adapted from spike-html-hosting-components (e3e60a8): README.md, sl-drawer's header, its
     header-actions group, the Settings opener, and each glyph button's class and interest hint.
     Adapted from spike-html-apps-foundation (18e0c55): demo/keys.html, its Help button and its keys
     help dialog.
     From spike-html-hosting-sdk (v{{version}}): template/index.html. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{name}}</title>
    <link rel="stylesheet" href="@jaimestill/spike-html-apps-foundation/page-full.css" />
    <link rel="stylesheet" href="@jaimestill/spike-html-hosting-components/glyph-button.css" />
    <link rel="stylesheet" href="@jaimestill/spike-html-hosting-sdk/site.css" />
    <script type="module" blocking="render" src="@jaimestill/spike-html-apps-foundation/register-full.js"></script>
    <script type="module" blocking="render" src="@jaimestill/spike-html-apps-foundation/preferences.js"></script>
    <script type="module" blocking="render" src="@jaimestill/spike-html-apps-foundation/keys.js"></script>
    <script type="module" blocking="render" src="@jaimestill/spike-html-hosting-components/site-nav.js"></script>
    <script type="module" blocking="render" src="@jaimestill/spike-html-hosting-components/site-index.js"></script>
    <script type="module" blocking="render" src="@jaimestill/spike-html-hosting-components/page-header.js"></script>
    <script type="module" blocking="render" src="@jaimestill/spike-html-hosting-components/section-tree.js"></script>
    <script type="module" blocking="render" src="@jaimestill/spike-html-hosting-components/drawer.js"></script>
    <script type="module" blocking="render">
      // The Pages button opens the Pages drawer, which holds the site index, and says through
      // aria-expanded whether it is open.
      const drawer = document.querySelector("sl-drawer#pages");
      const opener = document.querySelector(".pages-opener");
      opener.addEventListener("click", () => drawer.show());
      const expanded = () => opener.setAttribute("aria-expanded", String(drawer.open));
      drawer.addEventListener("open", expanded);
      drawer.addEventListener("close", expanded);
    </script>
    <script type="module" blocking="render">
      // Until the Settings dialog holds the reader's settings, the Settings button opens the
      // theme menu: the show-modal command it sends dialog#settings is cancelled, and the menu
      // shown in the dialog's place.
      const menu = document.querySelector("sl-theme-menu#theme");
      document.querySelector("dialog#settings").addEventListener("command", (event) => {
        event.preventDefault();
        menu.show();
      });
    </script>
  </head>
  <body>
    <header>
      <sl-site-nav></sl-site-nav>
      <div class="header-actions">
        <button
          type="button"
          class="glyph-button pages-opener"
          aria-controls="pages"
          aria-haspopup="dialog"
          aria-expanded="false"
          aria-label="Pages"
          data-keys="p"
          interestfor="pages-hint"
          aria-description=""
        >
          <svg data-icon="octicon/list-unordered-16"></svg>
          <span aria-hidden="true"><kbd>P</kbd></span>
        </button>
        <div id="pages-hint" class="glyph-hint" popover="hint" aria-hidden="true">Pages</div>
        <button
          type="button"
          class="glyph-button"
          commandfor="help"
          command="show-modal"
          aria-label="Help"
          data-keys="?"
          interestfor="help-hint"
          aria-description=""
        >
          <svg data-icon="octicon/question-16"></svg>
          <span aria-hidden="true"><kbd>?</kbd></span>
        </button>
        <div id="help-hint" class="glyph-hint" popover="hint" aria-hidden="true">Help</div>
        <button
          type="button"
          class="glyph-button"
          commandfor="settings"
          command="show-modal"
          aria-label="Settings"
          data-keys="s"
          interestfor="settings-hint"
          aria-description=""
        >
          <svg data-icon="octicon/gear-16"></svg>
          <span aria-hidden="true"><kbd>S</kbd></span>
        </button>
        <div id="settings-hint" class="glyph-hint" popover="hint" aria-hidden="true">Settings</div>
      </div>
    </header>
    <main></main>
    <sl-theme-menu id="theme"></sl-theme-menu>
    <dialog id="settings" aria-label="Settings"></dialog>
    <dialog id="help" aria-labelledby="help-title">
      <h2 id="help-title">Keyboard shortcuts</h2>
      <div data-keys-list></div>
      <footer>
        <button
          type="button"
          class="glyph-button"
          commandfor="help"
          command="close"
          aria-label="Close"
          data-keys="?"
          interestfor="help-close-hint"
          aria-description=""
        >
          <svg data-icon="octicon/x-16"></svg>
          <span aria-hidden="true"><kbd>?</kbd></span>
        </button>
        <div id="help-close-hint" class="glyph-hint" popover="hint" aria-hidden="true">Close</div>
      </footer>
    </dialog>
  </body>
</html>

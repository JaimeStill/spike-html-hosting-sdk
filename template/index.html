<!doctype html>
<!-- The site's GitHub Pages shell, which every page of the build fills (the SDK's markdownPages),
     its title the page's name and its main element the page's body. The foundation's full page
     entry and its registrations, every built-in profile, so the theme menu offers each, its
     preferences module, and its keys module, render-blocking, as the build makes every module
     script one entry; the SDK's site.css by the package's name, after the entry; and a button
     that opens the theme menu, which keys.js clicks on T. The components' four elements, each
     module defining its element, render-blocking too: the site nav, beside the Theme button, and
     the site index, the page header, and the section tree, which the SDK's markdownPages writes
     into each page with their light-DOM content.
     Adapted from spike-html-hosting (cb0511c): index.html, its title and text this site's, and its
     page a shell.
     Adapted from spike-html-hosting (fba414c): index.html, its full page entry, its keys module,
     and the Theme button that keys.js clicks on T.
     Adapted from spike-html-hosting-architecture (27d70e1): index.html, its title the site's
     repository and its stylesheet the SDK's.
     From spike-html-hosting-sdk (v{{version}}): template/index.html. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{name}}</title>
    <link rel="stylesheet" href="@jaimestill/spike-html-apps-foundation/page-full.css" />
    <link rel="stylesheet" href="@jaimestill/spike-html-hosting-sdk/site.css" />
    <script type="module" blocking="render" src="@jaimestill/spike-html-apps-foundation/register-full.js"></script>
    <script type="module" blocking="render" src="@jaimestill/spike-html-apps-foundation/preferences.js"></script>
    <script type="module" blocking="render" src="@jaimestill/spike-html-apps-foundation/keys.js"></script>
    <script type="module" blocking="render" src="@jaimestill/spike-html-hosting-components/site-nav.js"></script>
    <script type="module" blocking="render" src="@jaimestill/spike-html-hosting-components/site-index.js"></script>
    <script type="module" blocking="render" src="@jaimestill/spike-html-hosting-components/page-header.js"></script>
    <script type="module" blocking="render" src="@jaimestill/spike-html-hosting-components/section-tree.js"></script>
  </head>
  <body>
    <header>
      <sl-site-nav></sl-site-nav>
      <button type="button" commandfor="theme" command="--open" data-keys="t">Theme</button>
    </header>
    <main></main>
    <sl-theme-menu id="theme"></sl-theme-menu>
  </body>
</html>

# Adapted from spike-html-apps-foundation (d5037b4): .github/workflows/ci.yml, on pull requests
# only and its pins current.
# From spike-html-hosting-components (0f64672): .github/workflows/ci.yml.

name: CI

on:
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: jdx/mise-action@v5.2.6

      - name: mise run install
        run: mise run install

      - name: mise run check
        run: mise run check

# A site's CI, as a reusable workflow: the site's check on its pull requests. A site's own
# .github/workflows/ci.yml calls it from the SDK's release tag, and the calling workflow's event
# is the site's, so its checkout is the caller's repository at the pull request's merge commit:
#
#   on:
#     pull_request:
#       branches: [main]
#   jobs:
#     check:
#       uses: JaimeStill/spike-html-hosting-sdk/.github/workflows/site-ci.yml@vX.Y.Z
#
# It needs no permission beyond contents: read, the default. The SDK's pack carries this file, so
# each release tag's tree holds it, where GitHub reads a reusable workflow from; the SDK's own CI
# is ci.yml.
# Adapted from spike-html-hosting (fc5cf2c): .github/workflows/ci.yml, called by a site.
name: site CI

on:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # The caller's repository: a called workflow's github context is the caller's.
      - uses: actions/checkout@v7.0.1

      - uses: jdx/mise-action@v5.2.6

      - name: mise run install
        run: mise run install

      - name: mise run check
        run: mise run check
